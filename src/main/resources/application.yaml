spring:
  datasource:
    url: jdbc:mariadb://localhost:3306/semcitecSystemDB
    username: semcitecUser
    password: semcitecPassword
    driver-class-name: org.mariadb.jdbc.Driver
  jpa:
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MariaDBDialect
    hibernate:
      ddl-auto: update
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
rootDirectory: ${USERPROFILE}/app/
officialDocDirectory: ${rootDirectory}oficios/
userProfileImgDirectory: ${rootDirectory}fotosPerfil/

